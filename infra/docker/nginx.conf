map $http_x_request_id $dcp_request_id {
  default $http_x_request_id;
  "" $request_id;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;

  # nginx's stock mime.types has no .mjs entry; module workers need a JavaScript MIME type.
  include /etc/nginx/mime.types;
  types {
    text/javascript mjs;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    client_max_body_size 2m;
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $dcp_request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # API responses carry their own security headers (helmet); these cover the static app.
  location / {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    # Ignored by browsers over plain HTTP; takes effect behind TLS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # MapLibre runs its worker from a blob: URL; charts and the map set inline styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    try_files $uri /index.html;
  }
}
